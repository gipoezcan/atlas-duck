name: release

# M10 plan Task 26 (spec §12.2, §3.2, §2.5, §14 M10 exit; PD-182). A v* tag is always a release
# run: one signed build per tag, secrets only in jobs that declare `environment: release`, and the
# install tests on the signed packages before anything is uploaded.
#
#   bundle                 bundle.yml with release: true. A job that calls a reusable workflow
#                          cannot declare `environment:`; the signing jobs inside bundle.yml declare
#                          it themselves and so get the environment's secret values. The caller
#                          still names each secret (docs, reuse-workflows: "You can pass a secret by
#                          name even if it only exists in the environment" / "If the caller workflow
#                          doesn't pass an environment secret, the secret resolves to an empty string
#                          in the reusable workflow"), so it passes exactly the nine signing secret
#                          names, not `secrets: inherit` (no other repo or org secret reaches bundle.yml).
#                          https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows
#   release-verify-*       signtool / codesign / spctl / stapler checks on the uploaded packages
#                          (no secret needed, so no environment).
#   install-probes         install-probes.yml on this run's artifacts (workflow_run does not fire
#                          for a workflow run through workflow_call, so it is called here).
#   release-go-no-go       ci/check-release-go-no-go.mjs on docs/release/go-no-go-v1.md and
#                          docs/release/release-checklist.md (Task 33; secret-free, red until the
#                          named reviewer and every checklist row are filled).
#   upload                 needs all of the above. Q5 PLACEHOLDER (see the job).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    uses: ./.github/workflows/bundle.yml
    with:
      release: true
    secrets:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    permissions:
      contents: read

  release-verify-windows:
    name: release-verify-windows (Authenticode on the installer and its three exes)
    needs: bundle
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download bundle-x86_64-pc-windows-msvc
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-x86_64-pc-windows-msvc
          path: dist

      - name: signtool verify /pa /v (installer and extracted executables)
        shell: pwsh
        run: ./ci/release-verify-windows.ps1 -InstallerDir dist

  release-verify-macos:
    name: release-verify-macos (${{ matrix.target }})
    needs: bundle
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download bundle-${{ matrix.target }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-${{ matrix.target }}
          path: dist

      - name: codesign, hardened runtime, no get-task-allow, spctl, stapler
        env:
          ARCH: ${{ matrix.arch }}
        run: bash ci/release-verify-macos.sh dist "$ARCH"

  install-probes:
    needs: bundle
    uses: ./.github/workflows/install-probes.yml
    with:
      bundle_run_id: ${{ github.run_id }}
      bundle_sha: ${{ github.sha }}
    permissions:
      contents: read
      actions: read

  # Task 33: the go/no-go gate. Secret-free (no environment, read-only token). It is red until a human
  # fills docs/release/go-no-go-v1.md (verdict GO, the release-candidate commit R, build id, date, the named reviewer, Q7)
  # and every row of docs/release/release-checklist.md; `upload` waits for it. R must be an ancestor of this commit with only those two docs changed. The checker is not a
  # ci.yml step for that reason; only its .test.mjs runs there.
  release-go-no-go:
    name: release-go-no-go (record and checklist, R to this commit)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the gate runs git merge-base and git diff between R and this commit

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check the go/no-go record and the checklist
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: node ci/check-release-go-no-go.mjs docs/release/go-no-go-v1.md --checklist docs/release/release-checklist.md --commit "$RELEASE_SHA"

  # Q5 PLACEHOLDER: the upload channel is an open human decision (Q5). Until it is made, the
  # packages go to a DRAFT GitHub Release for the tag and are never published; publishing (or
  # another channel) replaces this job once Q5 is answered.
  upload:
    name: upload (Q5 placeholder, draft GitHub Release)
    needs: [bundle, release-verify-windows, release-verify-macos, install-probes, release-go-no-go]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download the bundle-* artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: dist

      - name: Attach the packages to a draft release for the tag (never published)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) | sort)
          [ "${#files[@]}" -eq 6 ] || { echo "::error::expected 6 packages, found ${#files[@]}"; printf '%s\n' "${files[@]}"; exit 1; }
          printf '%s\n' "${files[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a release for $TAG already exists; this placeholder only creates new drafts"
            exit 1
          fi
          gh release create "$TAG" --draft --verify-tag --title "$TAG" \
            --notes "Draft created by release.yml (Q5 placeholder). Not published." "${files[@]}"
