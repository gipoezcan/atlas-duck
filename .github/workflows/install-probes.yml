      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-probe-windows-per-machine
          path: ${{ runner.temp }}\install-probe-evidence
          if-no-files-found: warn
          retention-days: 14

  macos-arm64:
    name: macos-arm64 (dmg on macos-15)
