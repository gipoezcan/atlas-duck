    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # A manual run names the bundle run and its commit separately; a mismatched pair would probe
      # the packages of one commit with the scripts of another. The inputs reach the shell only
      # through env, are validated, and are compared with what the API says about that run.
      - name: Cross-check bundle_run_id and bundle_sha
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          BUNDLE_RUN_ID: ${{ inputs.bundle_run_id }}
          BUNDLE_SHA: ${{ inputs.bundle_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_API: ${{ github.api_url }}
        run: |
          set -euo pipefail
          if ! [[ "$BUNDLE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::bundle_run_id must be digits only"
            exit 1
          fi
          if ! [[ "$BUNDLE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::bundle_sha must be 40 lowercase hex digits"
            exit 1
          fi
          run_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GH_API/repos/$GH_REPO/actions/runs/$BUNDLE_RUN_ID")"
          name="$(jq -r '.name' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          echo "bundle run $BUNDLE_RUN_ID: workflow=$name conclusion=$conclusion head_sha=$head_sha"
          if [ "$name" != "bundle" ]; then
            echo "::error::run $BUNDLE_RUN_ID is a run of '$name', not of the bundle workflow"
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::bundle run $BUNDLE_RUN_ID did not succeed (conclusion: $conclusion)"
            exit 1
          fi
          if [ "$head_sha" != "$BUNDLE_SHA" ]; then
            echo "::error::bundle run $BUNDLE_RUN_ID bundled $head_sha, not bundle_sha $BUNDLE_SHA"
            exit 1
          fi

      - name: Checkout the commit that was bundled
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.bundle_sha }}
          persist-credentials: false

      - name: Install Rosetta 2 and fail loudly if it does not work (V32)
        run: |
          set -euo pipefail
          if ! sudo softwareupdate --install-rosetta --agree-to-license; then
            echo "::error::softwareupdate could not install Rosetta 2"
            exit 1
          fi
          arch -x86_64 /usr/bin/true || { echo "::error::Rosetta 2 cannot run x86_64 code"; exit 1; }
          echo "sysctl.proc_translated under arch -x86_64: $(arch -x86_64 /usr/sbin/sysctl -n sysctl.proc_translated)"

      - name: Download bundle-x86_64-apple-darwin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-x86_64-apple-darwin
          path: dist
          run-id: ${{ github.event.workflow_run.id || inputs.bundle_run_id }}
          github-token: ${{ github.token }}

      - name: Self-test the install-test script
        run: /bin/bash ci/install-test-macos.sh --self-test

      - name: Install from the dmg, start, quit, remove, reinstall (release half, no store)
        env:
          INSTALL_PROBE_EVIDENCE: ${{ runner.temp }}/install-test-evidence
        run: /bin/bash ci/install-test-macos.sh --release dist x86_64

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-test-macos-x86_64-rosetta
          path: ${{ runner.temp }}/install-test-evidence
          if-no-files-found: warn
          retention-days: 14

