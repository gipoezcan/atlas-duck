  macos-x86_64-rosetta:
    name: macos-x86_64-rosetta (x86_64 dmg under Rosetta 2 on macos-15)
    if: github.event_name == 'workflow_dispatch' || (github.event_name != 'workflow_run' && inputs.bundle_run_id != '') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
