        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-fixture-x86_64-unknown-linux-gnu
          path: ci-fixture
          run-id: ${{ github.event.workflow_run.id || inputs.bundle_run_id }}
