name: install-probes

# Installed-package probes (spec 9.4, 12.2, 13 "Scripts-enabled matrix", 14 M1 spike): every
# shipped package is installed fresh from the artifacts of the `bundle` workflow (T12), the
# installed app is started with `--background` against a CI pinned-paths fixture, and its
# `event=sandbox_probe` line in <data>/logs/diag.log is read.
#
#   windows-per-user      NSIS  setup.exe /S /CurrentUser   ACEs by the installer hook, re-apply, WER;
#                                                           floor=met failed=none is asserted
#   windows-per-machine   NSIS  setup.exe /S /AllUsers      ACEs by the installer hook, WER; floor=met asserted
#   macos-arm64           dmg -> /Applications, ad-hoc signed, hardened runtime
#   macos-x86_64-rosetta  dmg (x86_64) -> /Applications, runs translated on the arm64 runner
#   ubuntu-deb            apt install of the .deb
#   ubuntu-appimage       the AppImage through the FUSE runtime
#   fedora-rpm            dnf install of the .rpm in a fedora:40 container, tray_host=missing
#
# The record is the JOB LOG (T22 reads the logs): each probe step prints the full sandbox_probe
# line and a final PROBE_RECORD line (Windows also EVIDENCE_JSON). The evidence directory is
# uploaded as artifact install-probe-<job> as a copy.
#
# Result values. Windows: floor=met failed=none is asserted (the host scores the LPAC Winsock / RPC
# failures and the loopback timeout from unconfined controls, or falls back to the plain
# AppContainer; the line carries appcontainer_mode= and control_ok=), next to the installer's own
# duties (ACEs, location, ace=, WER). macOS: a bare
# `floor=met` is no proof (T18); the leg passes as proven only with an informative unconfined
# task_for_pid control, otherwise it prints FLOOR_INCONCLUSIVE and an INCONCLUSIVE line (the job
# stays green, the log says it is not a proof). Linux: floor=met is asserted.
#
# The scripts-enabled matrix (CI-07, M8 plan Task 28): every package job has a CI-07 step
# (ci/script-matrix-step.{sh,ps1} release), `if: false` until M10. On a release package it asserts
# floor=met failed=none and the installed worker answering in probe mode through the app's spawner;
# it runs no script (a fresh install is in the first-run state and serves no core). The dry run and
# the released real run are on the debug scripted-approver bundles (e2e-bundle.yml). The upgrade
# drain and the uninstall checks are the install-test-<pkg> jobs at the end of this file (M10 Task 27).
#
# Security (workflow_run executes the scripts of the commit it follows): the token is read-only
# (contents, actions), no secret is used, checkout does not persist credentials, the commit is the
# bundle run's head sha, and a workflow_run from a fork is skipped.
#
# workflow_run only fires for the copy of this file on the default branch. Before it is merged,
# start it by hand: gh workflow run install-probes.yml --ref <branch> -f bundle_run_id=<id of a
# successful bundle run> -f bundle_sha=<head sha of that bundle run>. bundle_sha pins the checkout
# to the commit that was bundled, so the scripts match the packages. Every job first checks the pair
# against the GitHub API (run is of the bundle workflow, succeeded, head_sha == bundle_sha).
#
# M10 Task 26: release.yml calls this workflow (workflow_call) with its own run id and sha, because
# workflow_run does not fire for bundle.yml run through workflow_call. In that case the jobs run on
# the caller's event (push of a v* tag), the API cross-check is skipped (the run is the caller's own,
# still in progress, and not named bundle), and the artifacts are the signed release packages.
# Still no secret is used.

on:
  workflow_run:
    workflows: [bundle]
    types: [completed]
  workflow_call:
    inputs:
      bundle_run_id:
        description: "Id of the calling run whose bundle-* artifacts are probed (release.yml passes github.run_id)"
        required: true
        type: string
      bundle_sha:
        description: "The commit that was bundled (release.yml passes github.sha)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      bundle_run_id:
        description: "Id of a successful run of the bundle workflow whose bundle-* artifacts are probed"
        required: true
        type: string
      bundle_sha:
        description: "Head sha of that bundle run (the commit that was bundled; the checkout is pinned to it)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  windows-per-user:
    name: windows-per-user (NSIS /CurrentUser on windows-2022)
    if: github.event_name == 'workflow_dispatch' || (github.event_name != 'workflow_run' && inputs.bundle_run_id != '') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      # A manual run names the bundle run and its commit separately; a mismatched pair would probe
      # the packages of one commit with the scripts of another. The inputs reach the shell only
      # through env, are validated, and are compared with what the API says about that run.
      - name: Cross-check bundle_run_id and bundle_sha
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          BUNDLE_RUN_ID: ${{ inputs.bundle_run_id }}
          BUNDLE_SHA: ${{ inputs.bundle_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_API: ${{ github.api_url }}
        run: |
          set -euo pipefail
          if ! [[ "$BUNDLE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::bundle_run_id must be digits only"
            exit 1
          fi
          if ! [[ "$BUNDLE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::bundle_sha must be 40 lowercase hex digits"
            exit 1
          fi
          run_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GH_API/repos/$GH_REPO/actions/runs/$BUNDLE_RUN_ID")"
          name="$(jq -r '.name' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          echo "bundle run $BUNDLE_RUN_ID: workflow=$name conclusion=$conclusion head_sha=$head_sha"
          if [ "$name" != "bundle" ]; then
            echo "::error::run $BUNDLE_RUN_ID is a run of '$name', not of the bundle workflow"
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::bundle run $BUNDLE_RUN_ID did not succeed (conclusion: $conclusion)"
            exit 1
          fi
          if [ "$head_sha" != "$BUNDLE_SHA" ]; then
            echo "::error::bundle run $BUNDLE_RUN_ID bundled $head_sha, not bundle_sha $BUNDLE_SHA"
            exit 1
          fi

      - name: Checkout the commit that was bundled
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.bundle_sha }}
          persist-credentials: false

      - name: Download bundle-x86_64-pc-windows-msvc
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-x86_64-pc-windows-msvc
          path: dist
          run-id: ${{ github.event.workflow_run.id || inputs.bundle_run_id }}
          github-token: ${{ github.token }}

      - name: Self-test the probe script
        shell: pwsh
        run: ./ci/install-probe-windows.ps1 -SelfTest

      - name: Install per user, start the app, record the sandbox_probe line, re-apply a removed ACE
        shell: pwsh
        env:
          INSTALL_PROBE_EVIDENCE: ${{ runner.temp }}\install-probe-evidence
        run: ./ci/install-probe-windows.ps1 -Mode CurrentUser -InstallerDir dist

      # CI-07 (spec 13 Scripts-enabled matrix, PD-150, R6 option (a); M8 Task 28), switched on in M10.
      # Asserts floor=met failed=none and that the installed worker answered in probe mode through the
      # app's spawner (worker_version in the sandbox_probe line). No script run: a fresh release install
      # is in the first-run state and serves no core.
      - name: CI-07 scripts-enabled matrix, release package (off until M10)
        if: false
        shell: pwsh
        run: ./ci/script-matrix-step.ps1 -Mode release -EvidenceDir "$env:RUNNER_TEMP\install-probe-evidence"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-probe-windows-per-user
          path: ${{ runner.temp }}\install-probe-evidence
          if-no-files-found: warn
          retention-days: 14

  windows-per-machine:
    name: windows-per-machine (NSIS /AllUsers on windows-2022)
    if: github.event_name == 'workflow_dispatch' || (github.event_name != 'workflow_run' && inputs.bundle_run_id != '') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
