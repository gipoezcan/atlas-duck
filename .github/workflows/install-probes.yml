          docker run --rm \
            --tmpfs /tmp:rw,exec \
            --env CI=true \
            --env INSTALL_PROBE_EVIDENCE=/evidence \
            --volume "$PWD:/work:ro" \
            --volume "$evidence:/evidence" \
            --workdir /work \
            fedora:40 \
            bash ci/install-test-linux.sh rpm dist ci-fixture

