      - name: Install from the dmg, start the translated app, read the sandbox_probe line
        env:
          INSTALL_PROBE_EVIDENCE: ${{ runner.temp }}/install-probe-evidence
        run: /bin/bash ci/install-probe-macos.sh dist x86_64

      # CI-07 (spec 13 Scripts-enabled matrix, PD-150, R6 option (a); M8 Task 28), switched on in M10.
      # Asserts floor=met failed=none and that the installed worker answered in probe mode through the
      # app's spawner (worker_version in the sandbox_probe line). No script run: a fresh release install
      # is in the first-run state and serves no core.
      - name: CI-07 scripts-enabled matrix, release package (off until M10)
        if: false
        run: /bin/bash ci/script-matrix-step.sh release "$RUNNER_TEMP/install-probe-evidence"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-probe-macos-x86_64-rosetta
