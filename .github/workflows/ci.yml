# Base CI for atlas-duck (spec §13 CI row, §10.1 supply chain).
# Jobs: rust (3-OS matrix), rust-macos-x86_64-rosetta, supply-chain.
# Later M1 tasks add steps or jobs to this file.
name: ci

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: rust (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system packages (Tauri, tray, D-Bus, Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            dbus-x11 \
            xvfb

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup toolchain install
          active="$(rustup show active-toolchain)"
          echo "$active"
          case "$active" in
            *rust-toolchain.toml*) ;;
            *) echo "::error::active toolchain does not come from rust-toolchain.toml"; exit 1 ;;
          esac
          rustc -vV
          cargo clippy --version
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "::error::rustc host is $host, expected ${{ matrix.target }}"
            exit 1
          fi

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Build the UI (tauri::generate_context! reads app/ui/dist)
        run: |
          npm --prefix app/ui ci --ignore-scripts
          npm --prefix app/ui run build

      - name: Clippy (-D warnings; unwrap_used/expect_used deny in core and atlassian)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Record host name sources and pinned-file base folders (§15 V28)
        run: |
          cargo test -p atlas-duck-ipc --locked --test paths -- --exact --nocapture host_name_is_the_sanitized_raw_name
          case "$RUNNER_OS" in
            macOS)
              echo "scutil LocalHostName: $(scutil --get LocalHostName 2>&1 || true)"
              echo "gethostname (hostname): $(hostname)"
              ;;
            Linux)
              echo "/etc/hostname: $(cat /etc/hostname 2>&1 || true)"
              echo "gethostname (hostname): $(hostname)"
              ;;
            Windows)
              echo "COMPUTERNAME: ${COMPUTERNAME:-unset}"
              ;;
          esac

      - name: Bin linkage (§2.1) - CLI and sandbox link no webview/TLS/DB/keyring libraries (Linux, macOS)
        if: runner.os != 'Windows'
        run: bash ci/check-bin-linkage.sh target/debug

      - name: Bin linkage (§2.1) - CLI and sandbox import no webview/TLS/DB/keyring DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/check-bin-linkage.ps1 -BinDir target/debug

      - name: Workspace dependency rule (§2.2)
        run: node ci/check-workspace.mjs

      - name: CI script tests
        run: node --test "ci/*.test.mjs"

  rust-macos-x86_64-rosetta:
    name: rust (x86_64-apple-darwin under Rosetta)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rosetta 2 and fail loudly if it does not work (§15 V32)
        run: |
          set -euo pipefail
          machine="$(uname -m)"
          if [ "$machine" != "arm64" ]; then
            echo "::error::runner hardware is $machine, expected arm64"
            exit 1
          fi
          if ! sudo softwareupdate --install-rosetta --agree-to-license; then
            echo "::error::softwareupdate could not install Rosetta 2"
            exit 1
          fi
          if ! arch -x86_64 /usr/bin/true; then
            echo "::error::Rosetta 2 is installed but cannot run x86_64 code"
            exit 1
          fi
          translated="$(arch -x86_64 /usr/sbin/sysctl -n sysctl.proc_translated)"
          echo "sysctl.proc_translated under arch -x86_64: $translated"
          if [ "$translated" != "1" ]; then
            echo "::error::x86_64 process is not translated by Rosetta"
            exit 1
          fi

      - name: Install the pinned Rust toolchain and the x86_64-apple-darwin target
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show active-toolchain
          rustup target add x86_64-apple-darwin
          rustup target list --installed

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-apple-darwin-rosetta
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Build the UI (tauri::generate_context! reads app/ui/dist)
        run: |
          npm --prefix app/ui ci --ignore-scripts
          npm --prefix app/ui run build

      - name: Test x86_64-apple-darwin (test binaries run under Rosetta)
        run: cargo test --workspace --locked --target x86_64-apple-darwin

      - name: Show that the test binaries are x86_64
        run: |
          set -euo pipefail
          file target/x86_64-apple-darwin/debug/deps/* | tee "$RUNNER_TEMP/file-report.txt"
          grep 'Mach-O 64-bit executable' "$RUNNER_TEMP/file-report.txt" > "$RUNNER_TEMP/executables.txt" || true
          if [ ! -s "$RUNNER_TEMP/executables.txt" ]; then
            echo "::error::no Mach-O test executables in target/x86_64-apple-darwin/debug/deps"
            exit 1
          fi
          # Every line starts with the path ".../x86_64-apple-darwin/...", so match
          # the architecture that `file` prints at the end of the line.
          if grep -v 'executable x86_64$' "$RUNNER_TEMP/executables.txt"; then
            echo "::error::a test executable in the x86_64 target dir is not x86_64"
            exit 1
          fi
          echo "x86_64 test executables: $(wc -l < "$RUNNER_TEMP/executables.txt")"

  locality-mounts:
    name: locality-mounts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    env:
      # An unset ATLAS_DUCK_TEST_* variable fails the test instead of skipping it.
      ATLAS_DUCK_REQUIRE_MOUNT_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: locality-mounts-${{ matrix.os }}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Loopback NFS and SMB mounts (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            nfs-kernel-server samba cifs-utils
          # The runner's cloud kernel may ship the cifs module only in
          # linux-modules-extra; install that package when modprobe fails.
          if ! sudo modprobe cifs; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe cifs
          fi
          # NFS: export a local dir to 127.0.0.1 and mount it back.
          sudo mkdir -p /srv/atlas-nfs /mnt/nfs
          sudo chown "$(id -u):$(id -g)" /srv/atlas-nfs
          echo "/srv/atlas-nfs 127.0.0.1(rw,sync,no_subtree_check,insecure)" | sudo tee /etc/exports
          sudo exportfs -ra
          sudo systemctl restart nfs-kernel-server
          sudo mount -t nfs -o vers=4.2 127.0.0.1:/srv/atlas-nfs /mnt/nfs
          mkdir -p /mnt/nfs/data
          stat -f -c 'V29 nfs f_type=0x%t (%T)' /mnt/nfs/data
          # SMB: share a local dir with Samba and mount it through cifs.
          SMB_PASS="$(openssl rand -hex 16)"
          sudo mkdir -p /srv/atlas-smb /mnt/smb
          sudo chown "$(id -u):$(id -g)" /srv/atlas-smb
          printf '[atlas]\n   path = /srv/atlas-smb\n   read only = no\n   valid users = %s\n' "$USER" | sudo tee -a /etc/samba/smb.conf > /dev/null
          printf '%s\n%s\n' "$SMB_PASS" "$SMB_PASS" | sudo smbpasswd -a -s "$USER"
          sudo systemctl restart smbd
          sudo mount -t cifs //127.0.0.1/atlas /mnt/smb -o "username=$USER,password=$SMB_PASS,uid=$(id -u),gid=$(id -g),vers=3.0"
          mkdir -p /mnt/smb/data
          stat -f -c 'V29 cifs f_type=0x%t (%T)' /mnt/smb/data
          echo "ATLAS_DUCK_TEST_NFS_DIR=/mnt/nfs/data" >> "$GITHUB_ENV"
          echo "ATLAS_DUCK_TEST_SMB_DIR=/mnt/smb/data" >> "$GITHUB_ENV"

      - name: Locality tests against the mounts (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p atlas-duck-ipc --test locality --locked -- --nocapture

      # Drive mappings are per logon session, so mapping, subst and the
      # test run share one step.
      - name: Mapped, subst and UNC-symlink drives + locality tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unc = '\localhost\C$'
          net use Y: $unc /persistent:no
          if ($LASTEXITCODE -ne 0) {
            Write-Host "net use $unc failed ($LASTEXITCODE); falling back to a local SMB share"
            $shareDir = Join-Path $env:RUNNER_TEMP 'atlas-smb'
            New-Item -ItemType Directory -Force $shareDir | Out-Null
            New-SmbShare -Name atlasduck -Path $shareDir -FullAccess "$env:USERDOMAIN\$env:USERNAME" | Out-Null
            $unc = '\localhost\atlasduck'
            net use Y: $unc /persistent:no
            if ($LASTEXITCODE -ne 0) { throw "net use $unc failed ($LASTEXITCODE)" }
          }
          $substDir = Join-Path $env:RUNNER_TEMP 'atlas-subst'
          New-Item -ItemType Directory -Force $substDir | Out-Null
          subst X: $substDir
          if ($LASTEXITCODE -ne 0) { throw "subst X: failed ($LASTEXITCODE)" }
          $link = Join-Path $env:RUNNER_TEMP 'atlas-unc-link'
          New-Item -ItemType SymbolicLink -Path $link -Target $unc | Out-Null
          Write-Host "V29 mapped Y: -> $unc; subst X: -> $substDir; symlink $link -> $unc"
          $env:ATLAS_DUCK_TEST_MAPPED_DRIVE = 'Y:\'
          $env:ATLAS_DUCK_TEST_SUBST_DRIVE = 'X:\'
          $env:ATLAS_DUCK_TEST_UNC_SYMLINK = $link
          cargo test -p atlas-duck-ipc --test locality --locked -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  supply-chain:
    name: supply-chain (cargo-deny, cargo-audit)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show active-toolchain

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2

      - name: cargo deny check (advisories, bans, licenses, sources)
        run: cargo deny --locked check

      - name: cargo audit
        run: cargo audit

  ui:
    name: ui (Vite + React shell, spec §2.4, §6.4)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: npm ci (no install scripts, spec §2.4)
        run: npm --prefix app/ui ci --ignore-scripts

      - name: Lint (ESLint + HTML-sink grep gate, spec §6.4)
        run: npm --prefix app/ui run lint

      - name: UI tests (Vitest + Testing Library)
        run: npm --prefix app/ui test

      - name: Gate, ESLint-rule and install-hygiene tests (node:test)
        run: npm --prefix app/ui run test:scripts

      - name: Build
        run: npm --prefix app/ui run build

      - name: npm audit (spec §10.1)
        run: npm --prefix app/ui audit
