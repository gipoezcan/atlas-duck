name: e2e-bundle

# M6 plan Task 33: the packaged-app GUI runs (CI-03 Fedora no-tray-host, CI-04 AppImage M6 steps).
# They run against a DEBUG `scripted-approver` Linux bundle, built here and not in bundle.yml: that
# build takes its base folders from ATLAS_DUCK_TEST_HOME (PD-01), so the runs never touch the runner's
# own pinned files, and bundle.yml builds shipped artifacts only (its ci/check-release-build.sh
# refuses --debug, --features and scripted-approver in any `cargo tauri build` line of that file).
# Nothing built here is ever shipped or uploaded as a bundle-<target> artifact.
#
# Driver-free (M6 CI ruling, task cifix6, run 38885675593): WebKitWebDriver cannot drive the
# first-run wizard on Linux (the incognito Setup window gets an ephemeral WebKit context without
# automation; the credential window has a context of its own, S-07), so both runs check what needs no
# driver (ci/gui-no-driver.sh: xwininfo window titles, the diag log, doctor, forwarded launches,
# SIGTERM) and the wizard, Install CLI to PATH and the store-backed windows are the manual rows of
# docs/release/linux-gui-checklist.md.
#
# Jobs:
#   bundle-linux-e2e      debug scripted-approver rpm + AppImage
#   fedora-no-tray-host   CI-03: fedora:40 container, Xvfb, session bus without a StatusNotifierWatcher
#   appimage-m6           CI-04 M6 steps: the AppImage through its FUSE runtime, no tray host, Setup window, doctor, forwarded launches, SIGTERM

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TAURI_CLI_VERSION: "2.12.1"

jobs:
  bundle-linux-e2e:
    name: bundle-linux-e2e (debug scripted-approver rpm + AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      TARGET: x86_64-unknown-linux-gnu
      TAURI_CLI_ARCHIVE: cargo-tauri-x86_64-unknown-linux-gnu.tgz
      TAURI_CLI_SHA256: 04ef3a9a2ed7b7dc479bef08ab40deee80065c99fc778f79ebce775eb72bbeff
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system packages (Tauri build, rpm tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libxdo-dev \
            libssl-dev \
            file \
            rpm \
            cpio

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show active-toolchain
          rustc -vV

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: bundle-e2e-${{ env.TARGET }}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Build the UI (tauri frontendDist)
        run: |
          set -euo pipefail
          npm --prefix app/ui ci --ignore-scripts
          npm --prefix app/ui run build
          for page in approvals credential; do test -f "app/ui/dist/$page.html"; done

      - name: Install cargo-tauri (prebuilt release, sha256-pinned)
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/cargo-tauri"
          mkdir -p "$dest"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$dest/$TAURI_CLI_ARCHIVE" \
            "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/${TAURI_CLI_ARCHIVE}"
          echo "${TAURI_CLI_SHA256}  $dest/$TAURI_CLI_ARCHIVE" | sha256sum -c -
          tar -xzf "$dest/$TAURI_CLI_ARCHIVE" -C "$dest"
          chmod +x "$dest/cargo-tauri"
          echo "$dest" >> "$GITHUB_PATH"

      - name: Show the cargo-tauri version
        run: cargo tauri --version

      # Debug profile (debug assertions on: the compile_error! lock of scripted-approver is open
      # there and only there) with the test-only feature; rpm and AppImage like the shipped bundle.
      - name: Build the debug scripted-approver rpm and AppImage
        working-directory: app/src-tauri
        env:
          # linuxdeploy and its plug-ins are AppImages themselves; extract-and-run needs no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo tauri build --ci --debug --features scripted-approver --target "$TARGET" --bundles rpm,appimage -- --locked

      - name: Stage the artifact (rpm, AppImage)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/e2e-bundle"
          bundle="target/$TARGET/debug/bundle"
          mkdir -p "$out/rpm" "$out/appimage"
          cp "$bundle"/rpm/*.rpm "$out/rpm/"
          cp "$bundle"/appimage/*.AppImage "$out/appimage/"
          ls -lR "$out"

      - name: Upload bundle-linux-e2e
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-linux-e2e
          path: ${{ runner.temp }}/e2e-bundle
          if-no-files-found: error
          retention-days: 7

  fedora-no-tray-host:
    name: fedora-no-tray-host (fedora:40, Xvfb, no StatusNotifierWatcher, driver-free, CI-03)
    needs: bundle-linux-e2e
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download bundle-linux-e2e
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-linux-e2e
          path: dist

      # /root is a runner directory, not the container's overlayfs: the app's locality checks (data
      # dir, keyring dir) fail closed on overlayfs. CI goes in: ci/pinned-fixture.sh runs only in CI.
      - name: Install the rpm on Fedora 40 and run the no-tray-host GUI checks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fedora-root"
          docker run --rm --env CI --volume "$PWD:/work" --volume "$RUNNER_TEMP/fedora-root:/root" --workdir /work fedora:40 \
            bash ci/fedora-no-tray-host.sh dist

      - name: Container logs (diagnostics)
        if: always()
        run: |
          # The container ran as root: its files may be owner-only, so read them with sudo. The
          # script also copies its logs to /root/e2e-diag (here: fedora-root/e2e-diag) before its own cleanup.
          sudo find "$RUNNER_TEMP/fedora-root" -maxdepth 6 -path "$RUNNER_TEMP/fedora-root/e2e-diag" -prune -o \( -name 'diag.log' -o -name 'app-*.log' \) -print -exec tail -n 60 {} \; 2>/dev/null || true
          sudo find "$RUNNER_TEMP/fedora-root/e2e-diag" -type f -print -exec tail -n 80 {} \; 2>/dev/null || true

      - name: Upload the Fedora diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diag-fedora
          path: ${{ runner.temp }}/fedora-root/e2e-diag
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the root-owned container files
        if: always()
        run: sudo rm -rf "$RUNNER_TEMP/fedora-root"

  appimage-m6:
    name: appimage-m6 (ubuntu-22.04, FUSE mount, driver-free, CI-04 M6 steps)
    needs: bundle-linux-e2e
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download bundle-linux-e2e
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-linux-e2e
          path: dist

      # libwebkit2gtk-4.1-0 is not what the app runs (the AppImage bundles its own WebKit, found first
      # through the AppImage's library path): its Depends bring the host libraries the AppImage leaves
      # out by linuxdeploy's exclude list (libEGL and the mesa EGL driver among them; task cifix7, run
      # 38894075809: "libEGL.so.1: cannot open shared object file"). bundle.yml's appimage-smoke gets
      # them from the deb's Depends; cifix6 round 1 got them through webkit2gtk-driver.
      - name: Install libfuse2, Xvfb, D-Bus, a Secret Service, xwininfo and the host GL libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 xvfb xauth dbus-x11 gnome-keyring libsecret-tools x11-utils python3 \
            libayatana-appindicator3-1 librsvg2-2 libwebkit2gtk-4.1-0
          command -v xwininfo
          ldconfig -p | grep -F 'libEGL.so.1 '

      - name: AppImage M6 section (no tray host, Setup window, doctor, forwarded launches, SIGTERM)
        env:
          # The script copies the diag log, the app logs and the doctor answers here before its cleanup
          # trap deletes them.
          E2E_DIAG_DIR: ${{ runner.temp }}/e2e-diag-appimage
        run: CI=true bash ci/appimage-smoke.sh --m6 dist

      - name: AppImage diagnostics
        if: always()
        run: |
          find "$RUNNER_TEMP/e2e-diag-appimage" -type f -print -exec tail -n 80 {} \; 2>/dev/null || true

      - name: Upload the AppImage diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diag-appimage
          path: ${{ runner.temp }}/e2e-diag-appimage
          if-no-files-found: ignore
          retention-days: 7

      - name: Kill stray processes
        if: always()
        run: |
          pkill -x atlas-duck-app || true
