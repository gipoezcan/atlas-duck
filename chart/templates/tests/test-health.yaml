apiVersion: v1
kind: Pod
metadata:
  name: {{ include "atlas-duck.fullname" . }}-test-health
  labels:
    {{- include "atlas-duck.labels" . | nindent 4 }}
    atlas-duck/role: helm-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- /* The server's scheduling rules (e.g. a node to avoid) apply to its test pod too. */}}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: {{ .Values.uid }}
    runAsGroup: {{ .Values.uid }}
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: {{ .Values.tests.image | quote }}
      command: ["sh", "-c"]
      args:
        - >-
          curl -fsS http://{{ include "atlas-duck.fullname" . }}:{{ .Values.service.port }}/healthz &&
          curl -fsS http://{{ include "atlas-duck.fullname" . }}:{{ .Values.service.port }}/readyz &&
          curl -fsS http://{{ include "atlas-duck.fullname" . }}:{{ .Values.metrics.port }}/metrics | grep -q '^atlas_duck_' &&
          test "$(curl -s -o /dev/null -w '%{http_code}' http://{{ include "atlas-duck.fullname" . }}:{{ .Values.service.port }}/metrics)" = 404
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
