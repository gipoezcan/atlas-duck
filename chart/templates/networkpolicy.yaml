{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlas-duck.fullname" . }}
  labels:
    {{- include "atlas-duck.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "atlas-duck.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.ingressFromAllNamespaces }}
    # The ingress controller's namespace is not visible to the team (deploy facts), and its
    # traffic can arrive from node addresses (host networking) that no namespaceSelector matches.
    # So any source may reach the HTTP port and the metrics port (Prometheus text with no user data,
    # scraped in-cluster; the Ingress never routes it); nothing else is open.
    - ports:
        - port: http
          protocol: TCP
        - port: metrics
          protocol: TCP
    {{- else }}
    # The ingress controller and monitoring namespaces (Q2), plus `helm test` pods of this release.
    - from:
        {{- range .Values.networkPolicy.ingressNamespaceSelectors }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              atlas-duck/role: helm-test
      ports:
        - port: http
          protocol: TCP
        - port: metrics
          protocol: TCP
    {{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # LDAPS (SM-2.1): only to the directory hosts when they are listed.
    - ports:
        - port: 636
          protocol: TCP
      {{- with .Values.networkPolicy.directoryCidrs }}
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      {{- end }}
    # The Atlassian instances over HTTPS.
    - ports:
        - port: 443
          protocol: TCP
        {{- range .Values.networkPolicy.extraEgressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
