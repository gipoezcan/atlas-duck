apiVersion: v1
kind: Service
metadata:
  name: {{ include "atlas-duck.fullname" . }}
  labels:
    {{- include "atlas-duck.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    # M13 T10: /metrics, for in-cluster scrapes. The Ingress routes only "http".
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "atlas-duck.selectorLabels" . | nindent 4 }}
