apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "atlas-duck.fullname" . }}-data
  labels:
    {{- include "atlas-duck.labels" . | nindent 4 }}
  {{- if .Values.persistence.keep }}
  annotations:
    # `helm uninstall` never deletes the data (production, PD-M13-3).
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  # ADR 0003: fixed, not a value; the guard refuses anything else.
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ required "atlas-duck: persistence.storageClassName is required (Q1)" .Values.persistence.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
