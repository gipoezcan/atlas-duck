{{- if .Values.ingress.enabled }}
{{- $host := required "atlas-duck: ingress.host is required" .Values.ingress.host }}
# Only the Service's `http` port: `/metrics` is served on the separate `metrics` port, which no
# Ingress routes (the main port answers `/metrics` with 404; M13 T10).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "atlas-duck.fullname" . }}
  labels:
    {{- include "atlas-duck.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
  {{- if .Values.ingress.useClusterIp }}
  {{- $_ := set $annotations "nginx.org/use-cluster-ip" "true" }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        - {{ $host | quote }}
      # An existing Secret; this chart never templates one (PD-M13-6).
      secretName: {{ required "atlas-duck: ingress.tls.secretName is required" .Values.ingress.tls.secretName }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "atlas-duck.fullname" . }}
                port:
                  name: http
{{- end }}
