[workspace]
resolver = "3"
members = [
    "crates/registry",
    "crates/core",
    "crates/atlassian",
    "crates/convert",
    "crates/preview",
    "crates/audit",
    "crates/ipc",
    "crates/sandbox-host",
    "crates/sandbox-worker",
    "crates/cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Exact pins for external crates (`name = "=x.y.z"`). Each later task adds the
# pins it needs; workspace-internal crates are declared as path dependencies in
# each member's own Cargo.toml so `default-features = false` keeps its meaning.
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio-util = { version = "=0.7.19", default-features = false, features = ["codec"] }
# Tauri 2.x only (Tauri 3 is alpha; research A0). Nothing but app/src-tauri depends on it (§2.2).
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-build = "=2.7.1"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-autostart = "=2.7.0"
zbus = "=5.19.0"
libc = "=0.2.190"
landlock = "=0.4.7"
seccompiler = "=0.5.0"
syscalls = { version = "=0.8.1", default-features = false, features = ["x86_64", "aarch64"] }
windows-sys = "=0.61.2"
rquickjs = { version = "=0.14.0", default-features = false, features = ["macro"] }
tempfile = "=3.27.0"
filetime = "=0.2.29"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "registry", "std"] }
toml_edit = { version = "=0.25.15", default-features = false, features = ["parse", "display"] }
core-foundation = "=0.10.1"
system-configuration-sys = "=0.6.0"
# M2 audit store (plan "Dependency pins").
rusqlite = { version = "=0.40.2", features = ["bundled"] }
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
sha2 = "=0.11.0"
hmac = "=0.13.0"
hkdf = "=0.13.0"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
zstd = { version = "=0.14.0", default-features = false }
getrandom = "=0.4.3"
zeroize = "=1.9.0"
secrecy = "=0.10.3"
serde_jcs = "=0.2.0"
unicode-normalization = "=0.1.25"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
base64 = "=0.22.1"
hex = "=0.4.3"
keyring-core = "=1.0.0"
windows-native-keyring-store = "=1.1.0"
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["crypto-rust"] }
proptest = "=1.11.0"

# §7.7: release builds use panic = "abort". Profiles are workspace-wide, so this
# covers atlas-duck-app, atlas-duck and atlas-duck-sandbox.
[profile.release]
panic = "abort"

# Argon2id with 64 MiB takes tens of seconds unoptimized; tests inherit the dev profile.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
