# Linux-only GitLab mirror of the jobs in .github/workflows/ci.yml (unverified:
# written without runner access). Windows, macOS and Rosetta legs exist only in
# the GitHub workflow.
#
# Shape: the `rust:1.95` image has cargo but no Node, the `node:22` image has Node
# but no cargo. So the UI is built in a Node job whose app/ui/dist is passed as an
# artifact (tauri::generate_context! needs it at compile time, so clippy and the tests
# cannot run without it), and the checks that need both (ci/check-workspace.mjs runs
# `cargo metadata`) run in the Node job after installing a minimal rustup toolchain.
stages: [ui, check, supply-chain]

default:
  image: rust:1.95

variables:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The shared runners OOM-kill (exit 137) a full-parallel Tauri build: cap rustc parallelism
  # and drop debuginfo to keep peak memory low.
  CARGO_BUILD_JOBS: "1"
  # Kubernetes runners: ask for more memory (honoured only if the runner allows the overwrite),
  # the default container limit OOM-killed both the Tauri build and the cache-restore helper.
  KUBERNETES_MEMORY_REQUEST: "6Gi"
  KUBERNETES_MEMORY_LIMIT: "8Gi"
  KUBERNETES_HELPER_MEMORY_LIMIT: "2Gi"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"

ui:
  stage: ui
  image: node:22
  script:
    - cd app/ui
    - npm ci --ignore-scripts
    - npm run lint
    - npm test
    - npm run test:scripts
    - npm run build
  artifacts:
    paths: [app/ui/dist]
    expire_in: 1 day

rust:test:
  stage: check
  needs:
    - job: ui
      artifacts: true
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev dbus-x11 xvfb
    - rustup toolchain install
  script:
    # The container's /tmp is an overlayfs whose layers are not visible inside the container; the data-dir
    # locality check fails closed on it, so tests that create data dirs need TMPDIR on the project volume.
    - mkdir -p "$CI_PROJECT_DIR/.tmp" && export TMPDIR="$CI_PROJECT_DIR/.tmp"
    # Same for the keyring dir: the container's home is an overlayfs too (§8.6 locality).
    - mkdir -p "$CI_PROJECT_DIR/.xdg" && export XDG_DATA_HOME="$CI_PROJECT_DIR/.xdg"
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    - cargo test --workspace --locked

rust:audit-keychain:
  stage: check
  needs: []
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends gnome-keyring dbus libsecret-tools
    - rustup toolchain install
  script:
    # TMPDIR and XDG_DATA_HOME on the project volume: the overlayfs /tmp and $HOME fail the
    # locality checks closed (see rust:test), the keychain tests would see keyring_not_local.
    - export TMPDIR="$CI_PROJECT_DIR/.tmp" XDG_DATA_HOME="$CI_PROJECT_DIR/.xdg"
    - mkdir -p "$TMPDIR" "$XDG_DATA_HOME"
    - bash ci/keyring-ci.sh

node:ci-checks:
  stage: check
  image: node:22
  needs: []
  variables:
    # The Node image ships no cargo: install the pinned toolchain (rust-toolchain.toml
    # says 1.95.0) with the official rustup script. Only `cargo metadata` runs here.
    RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup-home"
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95.0
    - export PATH="$CARGO_HOME/bin:$PATH"  # before_script and script share one shell
  script:
    - node ci/check-workspace.mjs
    - node --test "ci/*.test.mjs"
    - node ci/check-audit-vectors.mjs

supply-chain:
  stage: supply-chain
  needs: []
  before_script:
    - rustup toolchain install
    - cargo install --locked cargo-deny@0.20.2 cargo-audit@0.22.2
  script:
    - cargo deny --locked check
    - cargo audit
