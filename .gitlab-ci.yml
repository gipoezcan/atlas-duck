# Linux-only GitLab mirror of the jobs in .github/workflows/ci.yml (unverified:
# written without runner access). Windows, macOS and Rosetta legs exist only in
# the GitHub workflow.
#
# M6: the e2e job (tauri-driver, Windows and Linux), the S-04 release-build step, the Fedora
# no-tray-host run and the AppImage M6 steps are GitHub-only (ci.yml `e2e`, e2e-bundle.yml): they need
# a webview driver, Xvfb, a fedora:40 container or a Windows runner, which this mirror does not have.
#
# M8: the script suites that start the real app, CLI and sandbox worker (`script_flows`,
# `sandbox_runs`, the AppImage script step of CI-04, the CI-07 scripts-enabled matrix steps) and the
# confined-worker suites (`confined_scripts` incl. its Fedora run, `k_factor`) are GitHub-only
# (ci.yml, e2e-bundle.yml, install-probes.yml): the confinement evidence needs the OS legs
# (Windows, macOS, Rosetta), a fedora:40 container and a FUSE/Xvfb runner, which this mirror lacks.
#
# Shape: the `rust:1.95` image has cargo but no Node, the `node:22` image has Node
# but no cargo. So the UI is built in a Node job whose app/ui/dist is passed as an
# artifact (tauri::generate_context! needs it at compile time, so clippy and the tests
# cannot run without it), and the checks that need both (ci/check-workspace.mjs runs
# `cargo metadata`) run in the Node job after installing a minimal rustup toolchain.
stages: [ui, check, supply-chain, server-prepare, server-build, server-package, server-publish, server-deploy, server-verify]

default:
  image: rust:1.95

variables:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The shared runners OOM-kill (exit 137) a full-parallel Tauri build: cap rustc parallelism
  # and drop debuginfo to keep peak memory low.
  CARGO_BUILD_JOBS: "1"
  # Kubernetes runners: ask for more memory (honoured only if the runner allows the overwrite),
  # the default container limit OOM-killed both the Tauri build and the cache-restore helper.
  KUBERNETES_MEMORY_REQUEST: "6Gi"
  KUBERNETES_MEMORY_LIMIT: "8Gi"
  KUBERNETES_HELPER_MEMORY_LIMIT: "2Gi"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"

ui:
  stage: ui
  image: node:22
  variables:
    # The runner caps the job at 8Gi; vitest's default (one fork per core) outgrew it and a worker
    # died mid-run (pipeline 43004). Two forks stay well inside.
    KUBERNETES_MEMORY_REQUEST: "6Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
    # node's default heap ran out in approvals/injection.test.tsx on every GitLab run; the forks
    # inherit this, and two of them at 3 GiB still fit the 8Gi limit.
    NODE_OPTIONS: "--max-old-space-size=3072"
  script:
    - cd app/ui
    - npm ci --ignore-scripts
    - npm run lint
    - npm test -- --pool=forks --maxWorkers=2
    - npm run test:scripts
    - npm run build
    - npm run check:bundle
  artifacts:
    paths: [app/ui/dist]
    expire_in: 1 day

rust:test:
  stage: check
  needs:
    - job: ui
      artifacts: true
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev dbus-x11 xvfb xauth
    - rustup toolchain install
  script:
    # The container's /tmp is an overlayfs whose layers are not visible inside the container; the data-dir
    # locality check fails closed on it, so tests that create data dirs need TMPDIR on the project volume.
    - mkdir -p "$CI_PROJECT_DIR/.tmp" && export TMPDIR="$CI_PROJECT_DIR/.tmp"
    # Same for the keyring dir: the container's home is an overlayfs too (§8.6 locality).
    - mkdir -p "$CI_PROJECT_DIR/.xdg" && export XDG_DATA_HOME="$CI_PROJECT_DIR/.xdg"
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    # The real-worker sandbox test needs ATLAS_DUCK_SANDBOX_BIN and the built worker; GitHub's
    # `server` job runs it (and verify:review-sandbox checks the floor in the cluster).
    - cargo test --workspace --locked -- --skip the_real_worker_meets_the_floor_and_runs_a_script
    # cli_flows run on GitHub only (every OS leg, ci.yml): the app's data-dir locality check fails
    # closed on this runner's container volume ("the test data dir is not a local data dir"), so
    # none of the spawning flows can start an app here. ci/cli-flows-linux.sh itself is verified up
    # to that point (signal reset, xauth/xvfb, pass-count) by the GitLab run of 94459e5..507d6b6.
    # M5 jira_flows run on GitHub only, for the same reason as cli_flows (ci.yml: every OS leg).
    # M7 confluence_flows run on GitHub only, for the same reason as cli_flows (ci.yml: every OS leg).
    # M9 mcp_flows (it spawns `atlas-duck mcp` and the app), its S-02 MCP cases and the TypeScript
    # conformance run (npm ci, spawns binaries) run on GitHub only, for the same reason as cli_flows.
    # M4 plan Task 26 (T26b): the M4 suite with the test-only features, the app's startup tests (the S-02 cases
    # run on GitHub: they need the cli_flows harness; no sudo in this image, so no S-01
    # other-user step; no second account on a container runner).
    - cargo test -p atlas-duck-ipc --features test-paths --locked
    - cargo test -p atlas-duck-app --features scripted-approver --locked --test startup_ipc --test startup_gate --test commands_acl --test dto_fixtures --test credential
  after_script:
    - pkill -x atlas-duck-app || true

rust:audit-keychain:
  stage: check
  needs: []
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends gnome-keyring dbus libsecret-tools
    - rustup toolchain install
  script:
    # TMPDIR and XDG_DATA_HOME on the project volume: the overlayfs /tmp and $HOME fail the
    # locality checks closed (see rust:test), the keychain tests would see keyring_not_local.
    - export TMPDIR="$CI_PROJECT_DIR/.tmp" XDG_DATA_HOME="$CI_PROJECT_DIR/.xdg"
    - mkdir -p "$TMPDIR" "$XDG_DATA_HOME"
    - bash ci/keyring-ci.sh
    # M10 Task 9: the recovery-tier store APIs on the same Secret Service (all #[ignore]d).
    # Unlike GitHub, no check-no-skips here (this image has no Node), as for the os_keystore run
    # above: the GitHub legs are the gate that every listed test ran and passed.
    - KEYRING_CI_TEST=recovery_tier_os bash ci/keyring-ci.sh

node:ci-checks:
  stage: check
  image: node:22
  needs: []
  variables:
    # The Node image ships no cargo: install the pinned toolchain (rust-toolchain.toml
    # says 1.95.0) with the official rustup script. Only `cargo metadata` runs here.
    RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup-home"
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95.0
    - export PATH="$CARGO_HOME/bin:$PATH"  # before_script and script share one shell
  script:
    - node ci/check-workspace.mjs
    - node ci/check-csp.mjs
    - node ci/check-commands.mjs
    - node ci/check-dialog-proofs.mjs
    - node --test app/isolation/hook.test.mjs
    - node --test "ci/*.test.mjs"
    - node ci/check-audit-vectors.mjs

supply-chain:
  stage: supply-chain
  needs: []
  before_script:
    - rustup toolchain install
    - cargo install --locked cargo-deny@0.20.2 cargo-audit@0.22.2
  script:
    - cargo deny --locked check
    - cargo audit

# ---- M13 server mode deployment (plan 2026-10-26-atlas-duck-m13-server-deploy-ops.md) ----
# New jobs use `needs:` so they never wait on the desktop jobs above.

# T4 (PD-M13-10): helm lint/template over chart/ci (positive) and chart/ci-fail (must fail with
# their `# expect:` text), then the policy check over the rendered YAML and its self-test.
chart:test:
  stage: server-prepare
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  needs: []
  rules:
    - changes:
        - chart/**/*
        - deployment/**/*
        - ci/check-chart-*
        - ci/fixtures/chart-policy/**/*
        - .gitlab-ci.yml
  script:
    - sh ci/check-chart-policy.test.sh
    - sh ci/check-chart-matrix.sh
    - sh ci/check-chart-policy.sh rendered/*.yaml
  artifacts:
    when: always
    paths: [rendered/]
    expire_in: 1 week

# T11 (SM-1.4, SM-9, PD-M13-5, -9, -11, -12): build, publish and deploy the server.
# CI variables hold only registry credentials (HARBOR_*, ARTIFACTORY_*) and the cluster context
# of the runner; no secret reaches the chart, an image layer or a log (SM-9.1). Logins read the
# password from stdin. Images are deployed by digest.
#
# Open questions (plan Q1-Q6) are CHANGE-ME placeholders: the deploy jobs refuse to run while
# one is left in the files or variables they use.
# Anchors only (a hidden key, never a job).
.server-anchors:
  vars: &server-vars
    APP_NAME: atlas-duck-server
    KUBE_CONTEXT: team-dux@gip
    # The g-dux group's file variable KUBECONFIG_DUX holds the team-dux@gip context.
    KUBECONFIG: ${KUBECONFIG_DUX}
    KUBE_NAMESPACE: team-dux
    # Review hosts are <slug>.<REVIEW_DOMAIN>; each gets its own cert-manager certificate in the
    # Secret <release>-tls (no wildcard exists).
    REVIEW_DOMAIN: atlas-duck.dux.intern.gipmbh.de

  # Branch pipelines run the server jobs only when server-relevant paths changed against master
  # (PD-M13-12), so desktop-only branches never touch the cluster; master and server-v* tags
  # always.
  paths: &server-paths
    - crates/server*/**/*
    - crates/mcp-tools/**/*
    - app/ui/**/*
    - chart/**/*
    - deployment/**/*
    - .gitlab-ci.yml

  rules: &server-rules
    - if: $CI_COMMIT_TAG =~ /^server-v/
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH
      changes:
        paths: *server-paths
        compare_to: refs/heads/master

  review-rules: &review-rules
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
      when: never
    - if: $CI_COMMIT_BRANCH
      changes:
        paths: *server-paths
        compare_to: refs/heads/master

  # Refuses to go on while a placeholder is left (call with the files and NAME=value pairs).
  no-placeholders: &no-placeholders |
    no_placeholders() {
      bad=0
      for f in "$@"; do
        case "$f" in
          *=*) name="${f%%=*}"; value="${f#*=}"
               if [ "$value" = CHANGE-ME ] || [ -z "$value" ]; then echo "open question: CI variable $name is not set (see plan Q1-Q6)"; bad=1; fi ;;
          *) if grep -n 'CHANGE-ME' "$f"; then echo "open question: CHANGE-ME left in $f (see plan Q1-Q6)"; bad=1; fi ;;
        esac
      done
      [ "$bad" = 0 ]
    }
# T12 (SM-9.1, SM-9.2, PD-M13-7): no secret material, no disabled TLS verification, the CA bundle
# holds public certificates only. Cheap, so it runs in every pipeline.
server:guards:
  stage: server-prepare
  image: alpine:3.20.3
  needs: []
  script:
    - sh ci/check-no-secret-material.test.sh
    - sh ci/check-no-secret-material.sh
server:version:
  stage: server-prepare
  image: alpine:3.20.3
  needs: []
  variables: *server-vars
  rules: *server-rules
  script:
    - |
      set -eu
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        PROJECT_VERSION="${CI_COMMIT_TAG#server-v}"
        ARTIFACTORY_URL="${DOCKER_RELEASE_REPO:-central-docker-appinternal-release-local.intern.gipmbh.de}"
        ARTIFACTORY_HELM_URL="${HELM_RELEASE_REPO:-central-helm-integration-local.intern.gipmbh.de}"
      else
        # dux-deploy's date+slug+time+sha scheme, as SemVer (no leading zeros in minor/patch).
        DAY="${CI_JOB_STARTED_AT%%T*}"
        Y="${DAY%%-*}"; REST="${DAY#*-}"; M="${REST%%-*}"; D="${REST#*-}"
        M="${M#0}"; D="${D#0}"
        TIME_PART="${CI_JOB_STARTED_AT#*T}"; TIME_PART="${TIME_PART%Z}"; TIME_PART="${TIME_PART%+*}"
        HMS="$(echo "$TIME_PART" | awk -F: '{printf "%sh%sm%s", $1, $2, int($3)}')"
        SLUG="$(printf '%s' "${CI_COMMIT_REF_SLUG}" | cut -c1-25 | sed 's/-*$//')"
        PROJECT_VERSION="${Y}.${M}.${D}-${SLUG}-${HMS}-${CI_COMMIT_SHORT_SHA}"
        ARTIFACTORY_URL="${DOCKER_DEV_REPO:-central-docker-appinternal-dev-local.intern.gipmbh.de}"
        ARTIFACTORY_HELM_URL="${HELM_DEV_REPO:-central-helm-dev-local.intern.gipmbh.de}"
      fi
      {
        echo "PROJECT_VERSION=${PROJECT_VERSION}"
        echo "ARTIFACTORY_URL=${ARTIFACTORY_URL}"
        echo "ARTIFACTORY_REPO_KEY=${ARTIFACTORY_URL%%.*}"
        echo "ARTIFACTORY_HELM_URL=${ARTIFACTORY_HELM_URL}"
      } | tee build.env
  artifacts:
    reports:
      dotenv: build.env

server:image:
  stage: server-build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: [server:version]
  rules: *server-rules
  # The runners that build images (dux-deploy's build-container-image uses the same tag).
  tags: [ubuntu]
  variables:
    <<: *server-vars
    # A Rust release build (CARGO_BUILD_JOBS=4 in the Dockerfile's build stage).
    KUBERNETES_CPU_REQUEST: "2000m"
    KUBERNETES_CPU_LIMIT: "4000m"
    KUBERNETES_MEMORY_REQUEST: "6Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
  script:
    - mkdir -p /kaniko/.docker
    # The registry login lands in the job's own filesystem only (as dux-deploy), never in a log.
    - |
      cat <<EOF > /kaniko/.docker/config.json
      {"auths":{"${HARBOR_HOST}":{"username":"${HARBOR_USERNAME}","password":"${HARBOR_PASSWORD}"}}}
      EOF
    # The only build argument is the commit (SM-9.1, PD-M13-9).
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/crates/server/Dockerfile"
      --destination "${HARBOR_HOST}/${HARBOR_PROJECT}/${APP_NAME}:${CI_COMMIT_REF_SLUG}"
      --build-arg "GIT_SHA=${CI_COMMIT_SHA}"
      --digest-file "${CI_PROJECT_DIR}/image.digest"
      --cache=true
      --cache-ttl=24h
  artifacts:
    paths: [image.digest]
    expire_in: 30 days

server:publish-harbor:
  stage: server-publish
  image:
    name: quay.io/skopeo/stable:v1.16.1
    entrypoint: [""]
  needs: [server:version, server:image]
  rules: *server-rules
  variables: *server-vars
  # The persistent Harbor project named after the Artifactory repo key (dux-deploy pattern): the
  # deploy jobs pull from here, by digest.
  script:
    - printf '%s' "${HARBOR_PASSWORD}" | skopeo login --username "${HARBOR_USERNAME}" --password-stdin "${HARBOR_HOST}"
    - skopeo copy --preserve-digests
      "docker://${HARBOR_HOST}/${HARBOR_PROJECT}/${APP_NAME}@$(cat image.digest)"
      "docker://${HARBOR_HOST}/${ARTIFACTORY_REPO_KEY}/${APP_NAME}:${PROJECT_VERSION}"
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure, unknown_failure, api_failure]

server:publish-artifactory:
  stage: server-publish
  image:
    name: quay.io/skopeo/stable:v1.16.1
    entrypoint: [""]
  needs: [server:version, server:image]
  rules: *server-rules
  variables: *server-vars
  script:
    - printf '%s' "${HARBOR_PASSWORD}" | skopeo login --username "${HARBOR_USERNAME}" --password-stdin "${HARBOR_HOST}"
    - printf '%s' "${ARTIFACTORY_PASSWORD}" | skopeo login --username "${ARTIFACTORY_USERNAME}" --password-stdin "${ARTIFACTORY_URL}"
    - skopeo copy --preserve-digests
      "docker://${HARBOR_HOST}/${HARBOR_PROJECT}/${APP_NAME}@$(cat image.digest)"
      "docker://${ARTIFACTORY_URL}/${APP_NAME}:${PROJECT_VERSION}"

server:chart-package:
  stage: server-package
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  needs: [server:version]
  rules: *server-rules
  variables: *server-vars
  script:
    - 'sed -i "s/^version: .*/version: ${PROJECT_VERSION}/" chart/Chart.yaml'
    - 'sed -i "s/^appVersion: .*/appVersion: \"${PROJECT_VERSION}\"/" chart/Chart.yaml'
    - helm lint --strict chart -f chart/ci/minimal.yaml
    - helm package chart
  artifacts:
    paths: ["${APP_NAME}-${PROJECT_VERSION}.tgz"]
    expire_in: 30 days

server:chart-publish:
  stage: server-publish
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  needs: [server:version, server:chart-package]
  rules: *server-rules
  variables: *server-vars
  script:
    - printf '%s' "${ARTIFACTORY_PASSWORD}" | helm registry login --username "${ARTIFACTORY_USERNAME}" --password-stdin "${ARTIFACTORY_HELM_URL}"
    - helm push "${APP_NAME}-${PROJECT_VERSION}.tgz" "oci://${ARTIFACTORY_HELM_URL}/"

.deploy-base: &deploy-base
  image:
    name: ghcr.io/helmfile/helmfile:v0.169.1
    entrypoint: [""]
  stage: server-deploy
  needs: [server:version, server:image, server:publish-harbor, server:chart-package]
  before_script:
    - mkdir -p build
    - tar xzf "${APP_NAME}-${PROJECT_VERSION}.tgz" -C build
    - mv build/${APP_NAME} build/chart
    - cp -Rp deployment/* build/

deploy:review:
  <<: *deploy-base
  variables: *server-vars
  rules: *review-rules
  script:
    - *no-placeholders
    - |
      set -eu
      no_placeholders deployment/values-review.yaml deployment/ca/org-ca.pem \
        "REVIEW_DOMAIN=${REVIEW_DOMAIN}"
      SLUG="$(printf '%s' "${CI_COMMIT_REF_SLUG}" | cut -c1-40 | sed 's/-*$//')"
      export RELEASE_NAME="atlas-duck-${SLUG}"
      HOST="${SLUG}.${REVIEW_DOMAIN}"
      KEY_SECRET="${RELEASE_NAME}-master-key"
      K="kubectl --context ${KUBE_CONTEXT} -n ${KUBE_NAMESPACE}"
      # PD-M13-5: a per-environment test master key, generated here into a job-local tmpfs file
      # and written straight into a Secret; never echoed, never a CI variable. Only if absent, so
      # a redeploy keeps the data readable. stop:review deletes it.
      if ! $K get secret "${KEY_SECRET}" -o name > /dev/null 2>&1; then
        set +x
        KEY_DIR="$(mktemp -d /dev/shm/atlas-duck-key.XXXXXX)"
        chmod 700 "${KEY_DIR}"
        ( umask 077
          printf 'atlas-duck-master-key/v1 review-%s %s\n' "${CI_PIPELINE_ID}" \
            "$(head -c 32 /dev/urandom | base64 | tr -d '\n')" > "${KEY_DIR}/key" )
        $K create secret generic "${KEY_SECRET}" --from-file=key="${KEY_DIR}/key" > /dev/null
        rm -rf "${KEY_DIR}"
        echo "created review master key Secret ${KEY_SECRET}"
      fi
      ARGS="--set image.repository=${HARBOR_HOST}/${ARTIFACTORY_REPO_KEY}/${APP_NAME}"
      ARGS="${ARGS} --set image.digest=$(cat image.digest)"
      ARGS="${ARGS} --set publicUrl=https://${HOST} --set ingress.host=${HOST}"
      ARGS="${ARGS} --set ingress.tls.secretName=${RELEASE_NAME}-tls"
      ARGS="${ARGS} --set masterKey.existingSecret=${KEY_SECRET}"
      ARGS="${ARGS} --set podAnnotations.commit-sha=${CI_COMMIT_SHORT_SHA}"
      # Server-side schema validation before anything changes (PD-M13-10).
      # The cluster's /openapi/v2 answers 503 (an aggregated API is down; /openapi/v3 works):
      # nothing here may fetch it. Client-side validation is off everywhere; the server-side
      # dry run and the apply itself still get every schema and admission error from the server.
      echo "== tool versions"
      kubectl version --client || true
      helm version || true
      helmfile version || true
      echo "== helmfile template"
      helmfile -e review -f build/helmfile.yaml template --skip-deps ${ARGS} > rendered-review.yaml
      echo "== server-side dry run (without helm hooks: a test Pod left by helm test is immutable)"
      sh ci/drop-helm-hooks.sh rendered-review.yaml > rendered-review-objects.yaml
      $K apply --server-side --field-manager=atlas-duck-ci --dry-run=server --force-conflicts --validate=false \
        -f rendered-review-objects.yaml > /dev/null
      echo "== helmfile apply"
      helmfile -e review -f build/helmfile.yaml apply --skip-deps ${ARGS}
      echo "REVIEW_URL=https://${HOST}" > review.env
      echo "RELEASE_NAME=${RELEASE_NAME}" >> review.env
  artifacts:
    reports:
      dotenv: review.env
    paths: [rendered-review.yaml]
    expire_in: 3 days
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: $REVIEW_URL
    on_stop: stop:review
    auto_stop_in: 3 days

# Self-contained (dux-deploy's lesson): runs days later when artifacts and the branch are gone.
stop:review:
  image:
    name: ghcr.io/helmfile/helmfile:v0.169.1
    entrypoint: [""]
  stage: server-deploy
  needs: []
  variables:
    <<: *server-vars
    GIT_STRATEGY: none
  script:
    - |
      set -eu
      SLUG="$(printf '%s' "${CI_COMMIT_REF_SLUG}" | cut -c1-40 | sed 's/-*$//')"
      RELEASE_NAME="atlas-duck-${SLUG}"
      K="kubectl --context ${KUBE_CONTEXT} -n ${KUBE_NAMESPACE}"
      helm uninstall "${RELEASE_NAME}" --namespace "${KUBE_NAMESPACE}" --kube-context "${KUBE_CONTEXT}" --ignore-not-found
      # The throwaway volume and the test keys go with it (review only; production keeps its PVC).
      $K delete pvc "${RELEASE_NAME}-data" --ignore-not-found
      $K delete secret "${RELEASE_NAME}-master-key" "${RELEASE_NAME}-master-key-next" "${RELEASE_NAME}-tls" --ignore-not-found
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
      when: never
    - if: $CI_COMMIT_BRANCH
      changes:
        paths: *server-paths
        compare_to: refs/heads/master
      when: manual
  allow_failure: true

# Every master pipeline deploys production automatically once the earlier stages pass
# (user decision 2026-10-28, replacing PD-M13-11's manual gate).
deploy:production:
  <<: *deploy-base
  variables: *server-vars
  # Automatic deploys must not skip the UI tests and checks. chart:test runs only when the chart
  # changes, so it is optional (a required need on an absent job rejects the whole pipeline).
  needs:
    - server:version
    - server:image
    - server:publish-harbor
    - server:chart-package
    - ui
    - node:ci-checks
    - job: chart:test
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: on_success
  allow_failure: false
  script:
    - *no-placeholders
    - |
      set -eu
      no_placeholders deployment/values-production.yaml deployment/ca/org-ca.pem
      # Batch-2 review M7: only from a protected master (with the protected "production"
      # environment and its required approval configured in GitLab, docs/server/deployment.md).
      if [ "${CI_COMMIT_REF_PROTECTED:-false}" != true ]; then
        echo "master is not a protected branch: refusing to deploy production"
        exit 1
      fi
      export RELEASE_NAME="atlas-duck"
      K="kubectl --context ${KUBE_CONTEXT} -n ${KUBE_NAMESPACE}"
      # The production master key is created out of band (PD-M13-5): check it exists, by name only.
      if ! $K get secret atlas-duck-master-key -o name > /dev/null 2>&1; then
        echo "Secret atlas-duck-master-key is missing in ${KUBE_NAMESPACE}: create it first (docs/server/deployment.md)"
        exit 1
      fi
      BIND_SECRET="$(sed -n 's/^    existingSecret: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' deployment/values-production.yaml | tail -n 1)"
      if [ -n "${BIND_SECRET}" ] && ! $K get secret "${BIND_SECRET}" -o name > /dev/null 2>&1; then
        echo "Secret ${BIND_SECRET} (directory service bind) is missing"
        exit 1
      fi
      ARGS="--set image.repository=${HARBOR_HOST}/${ARTIFACTORY_REPO_KEY}/${APP_NAME}"
      ARGS="${ARGS} --set image.digest=$(cat image.digest)"
      ARGS="${ARGS} --set podAnnotations.commit-sha=${CI_COMMIT_SHORT_SHA}"
      # The cluster's /openapi/v2 answers 503 (an aggregated API is down; /openapi/v3 works):
      # nothing here may fetch it. Client-side validation is off everywhere; the server-side
      # dry run and the apply itself still get every schema and admission error from the server.
      echo "== tool versions"
      kubectl version --client || true
      helm version || true
      helmfile version || true
      echo "== helmfile template"
      helmfile -e production -f build/helmfile.yaml template --skip-deps ${ARGS} > rendered-production.yaml
      echo "== server-side dry run (without helm hooks: a test Pod left by helm test is immutable)"
      sh ci/drop-helm-hooks.sh rendered-production.yaml > rendered-production-objects.yaml
      $K apply --server-side --field-manager=atlas-duck-ci --dry-run=server --force-conflicts --validate=false \
        -f rendered-production-objects.yaml > /dev/null
      echo "== helmfile apply"
      helmfile -e production -f build/helmfile.yaml apply --skip-deps ${ARGS}
  environment:
    name: production
    deployment_tier: production
# T14 (master-plan exit criterion): the review environment answers through the ingress with TLS
# verified against the system bundle (the ingress certificate is Let's Encrypt via cert-manager;
# deployment/ca/org-ca.pem is the AD root for LDAPS only), signs in a test user, serves MCP to an API key and refuses it once
# revoked, and passes `helm test`.
verify:review-smoke:
  stage: server-verify
  image:
    name: ghcr.io/helmfile/helmfile:v0.169.1
    entrypoint: [""]
  needs: [deploy:review]
  variables: *server-vars
  rules: *review-rules
  script:
    - sh ci/review-smoke.sh
# T15 (master-plan exit criterion: key rotation and backup/restore pass on a review environment).
# On demand: it rotates the review environment's key, restores, and deactivates a test user.
# Required once for the M13 exit; keep the job log as evidence.
verify:review-ops-drill:
  stage: server-verify
  image:
    name: ghcr.io/helmfile/helmfile:v0.169.1
    entrypoint: [""]
  needs: [server:version, server:chart-package, deploy:review]
  variables: *server-vars
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
      when: never
    - if: $CI_COMMIT_BRANCH
      changes:
        paths: *server-paths
        compare_to: refs/heads/master
      when: manual
  allow_failure: true
  script:
    - sh ci/review-ops-drill.sh
# M14 T15 (PD-250): the sandbox floor in the review pod under RuntimeDefault; keep the evidence line.
verify:review-sandbox:
  stage: server-verify
  image:
    name: ghcr.io/helmfile/helmfile:v0.169.1
    entrypoint: [""]
  needs: [deploy:review]
  variables: *server-vars
  rules: *review-rules
  script:
    - sh -n ci/review-sandbox.sh
    - sh ci/review-sandbox.sh

# M14 T23 (PD-260): the e2e binary, built in this pipeline (never a downloaded tool).
server:e2e-build:
  stage: server-build
  needs: []
  # A Rust build: the image builders' runners, within their 8Gi job limit.
  tags: [ubuntu]
  variables:
    <<: *server-vars
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
  rules: *review-rules
  script:
    - rustup toolchain install
    - cargo test -p atlas-duck-server-e2e --lib --locked
    # The `[[test]] e2e` target's executable from cargo's JSON messages: the human "Executable"
    # line is coloured here (CARGO_TERM_COLOR=always), which broke a text match (pipeline 43122).
    - |
      set -eu
      CARGO_TERM_COLOR=never cargo test -p atlas-duck-server-e2e --test e2e --no-run --locked \
        --message-format=json > e2e-build.json
      bin="$(grep '"reason":"compiler-artifact"' e2e-build.json \
        | grep '"kind":\["test"\]' | grep '"name":"e2e"' \
        | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | tail -n 1)"
      if [ -z "$bin" ] || [ ! -x "$bin" ]; then
        echo "server:e2e-build: no executable for the e2e test target in cargo's JSON output:"
        grep '"name":"e2e"' e2e-build.json | cut -c1-400 || true
        exit 1
      fi
      echo "e2e test binary: $bin"
      mkdir -p e2e-bin && cp "$bin" e2e-bin/e2e
  artifacts:
    paths: [e2e-bin/e2e]
    expire_in: 1 day

# M14 T23: the black-box suite against the review environment (Jira none, L258) at
# https://<slug>.atlas-duck.dux.intern.gipmbh.de (REVIEW_URL from deploy:review), TLS verified against
# the system trust store (the ingress certificate is cert-manager's letsencrypt; INGRESS_CA_BUNDLE
# overrides it; org-ca.pem is the LDAPS root and not used here); it waits for the ingress as the smoke.
verify:review-e2e:
  stage: server-verify
  needs: [deploy:review, verify:review-smoke, server:e2e-build]
  variables: *server-vars
  rules: *review-rules
  timeout: 20m
  script:
    - sh -n ci/review-e2e.sh
    - sh ci/review-e2e.sh
  artifacts:
    when: always
    paths: [e2e-summary.txt, e2e-output.txt]
    expire_in: 2 weeks