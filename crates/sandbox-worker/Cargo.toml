[package]
name = "atlas-duck-sandbox-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
atlas-duck-ipc = { path = "../ipc", default-features = false }
rquickjs = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Linux confinement (T17, §9.4): seccompiler builds the BPF programs, landlock
# applies the empty ruleset, syscalls maps the allowlist's names to numbers.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }
seccompiler = { workspace = true }
syscalls = { workspace = true }

[[test]]
name = "confined_workload"
harness = false
