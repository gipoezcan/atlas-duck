[package]
name = "atlas-duck-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# §4.7 test exception: the launched app's environment also keeps `ATLAS_DUCK_TEST_HOME` and
# `ATLAS_DUCK_TEST_KEYSTORE`. Test builds only: a release build with it fails to compile (lib.rs),
# and only the test forwarders (atlas-duck-app/scripted-approver) may enable it.
test-env = []

[dependencies]
atlas-duck-ipc = { path = "../ipc" }
atlas-duck-registry = { path = "../registry" }
lexopt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "sync", "macros", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
