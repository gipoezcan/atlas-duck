[package]
name = "atlas-duck-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# §4.7 test exception: the launched app's environment also keeps `ATLAS_DUCK_TEST_HOME` and
# `ATLAS_DUCK_TEST_KEYSTORE`. Test builds only: a release build with it fails to compile (lib.rs),
# and only the test forwarders (atlas-duck-app/scripted-approver) may enable it.
test-env = []

[dependencies]
atlas-duck-ipc = { path = "../ipc" }
atlas-duck-registry = { path = "../registry" }
lexopt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "sync", "macros", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# §4.7 Windows launch (shell parent, job breakaway, stub) and the PD-24 session check.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
async-trait = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_ToolHelp"] }
