[package]
name = "atlas-duck-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["async"]
# Gates the tokio-based codecs. The sandbox worker
# depends on this crate with default-features = false and stays tokio-free.
async = ["dep:tokio-util", "dep:async-trait", "dep:sha2", "dep:getrandom"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = { workspace = true }
serde_jcs = { workspace = true }
tokio-util = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
system-configuration-sys = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
