[package]
name = "atlas-duck-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["async"]
# Gates the tokio-based codecs. The sandbox worker
# depends on this crate with default-features = false and stays tokio-free.
async = ["dep:tokio", "dep:tokio-util", "dep:tracing", "dep:async-trait", "dep:getrandom", "dep:sha2"]
# PD-01: `paths::base_dirs()` and `paths::socket_dir()` honour `ATLAS_DUCK_TEST_HOME`. Test builds
# only: a release build with it fails to compile (lib.rs), and only the test forwarders may enable it.
test-paths = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = { workspace = true }
serde_jcs = { workspace = true }
tokio = { workspace = true, optional = true, features = ["net", "io-util", "time", "rt", "sync", "macros"] }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
system-configuration-sys = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The pipe-name prefix (`paths::endpoint_location`) hashes the user SID.
sha2 = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
