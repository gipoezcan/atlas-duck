[package]
name = "atlas-duck-atlassian"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# §13: plain http to the mock only through this test-only feature; `lib.rs` refuses
# to compile it into a release build.
insecure-test-http = []
# The wiremock / raw-socket / local-TLS harness in `src/testing/`.
testing = [
    "insecure-test-http",
    "dep:wiremock",
    "dep:rcgen",
    "dep:tokio-rustls",
    "tokio/net",
    "tokio/io-util",
    "tokio/rt",
]

[dependencies]
url = { workspace = true }
sha2 = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
icu_normalizer = { workspace = true }
icu_casemap = { workspace = true }
percent-encoding = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
httpdate = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tokio-util = { workspace = true }
wiremock = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }

[[test]]
name = "client"
required-features = ["testing"]

[[test]]
name = "tls_ca"
required-features = ["testing"]

[[test]]
name = "proxy_env"
required-features = ["testing"]

[[test]]
name = "pagination"
required-features = ["testing"]

[[test]]
name = "writes"
required-features = ["testing"]

[[test]]
name = "fixtures"
required-features = ["testing"]

# §7.7 / §13: unwrap_used and expect_used are errors in core and atlassian.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
