[package]
name = "atlas-duck-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
atlas-duck-registry = { path = "../registry" }
atlas-duck-atlassian = { path = "../atlassian" }
atlas-duck-convert = { path = "../convert" }
atlas-duck-preview = { path = "../preview" }
atlas-duck-audit = { path = "../audit" }
atlas-duck-ipc = { path = "../ipc" }
async-trait = { workspace = true }
toml_edit = { workspace = true }
jsonschema = { workspace = true }
html-escape = { workspace = true }
icu_normalizer = { workspace = true }
idna = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
secrecy = { workspace = true }
# `InstanceAdmin::set_token`'s `expires_at` (C.4 `StoredCredential` uses `chrono::NaiveDate`).
chrono = { workspace = true }
hex = { workspace = true }
# M2's pin, reused for `{"b64": ..}` bodies (§8.3 payloads).
base64 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { workspace = true }
# The candidate LRU (§5.2 memory budget), byte-accounted by `engine::cache`.
lru = { workspace = true }
tempfile = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
system-configuration-sys = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Registry"] }

[features]
# `core::testing` (`TempStore`, `FaultyAudit`) over the wiremock harness and the audit doubles,
# plus `HttpFactory::with_timeouts` for tests that need short budgets. Never a release build.
testing = ["atlas-duck-atlassian/testing", "atlas-duck-audit/testing", "dep:tempfile"]

[dev-dependencies]
atlas-duck-atlassian = { path = "../atlassian", features = ["testing"] }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
# Read-flow tests mount their own answers (delays, body matchers) on `MockDc::server()`.
wiremock = { workspace = true }

# `budget.rs` :: `i37_rss_bounded_256_pending` reads the process working set (I-37, PD-15).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

# §7.7 / §13: unwrap_used and expect_used are errors in core and atlassian.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
