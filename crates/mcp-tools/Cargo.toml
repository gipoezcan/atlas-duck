[package]
name = "atlas-duck-mcp-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The transport-free part of the M9 MCP front end (plan PD-193): tool catalog, argument checks,
# envelope -> tool-result mapping. No tokio, no HTTP, no IPC session. cli and server use it.
[dependencies]
atlas-duck-ipc = { path = "../ipc", default-features = false }
atlas-duck-registry = { path = "../registry" }
# `Tool`/`CallToolResult` model types only.
rmcp = { workspace = true, features = ["server"] }
serde = { workspace = true }
serde_json = { workspace = true }

# Plan "Global Constraints" (lints): no unwrap/expect/print in the shared MCP layer.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
