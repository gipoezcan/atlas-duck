[package]
name = "atlas-duck-app"
description = "atlas-duck tray app (Tauri 2) and the thin mains of the atlas-duck and atlas-duck-sandbox bins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# §12.1: `default-run = "atlas-duck-app"`.
default-run = "atlas-duck-app"
# The three bins are listed explicitly below; no auto-discovery.
autobins = false

[lib]
name = "atlas_duck_app_lib"
path = "src/lib.rs"

# §12.1: all three binaries are [[bin]] targets of the Tauri package (thin mains calling into their
# crates), so the Tauri bundler ships them next to the app without target-triple renaming.
[[bin]]
name = "atlas-duck-app"
path = "src/main.rs"

[[bin]]
name = "atlas-duck"
path = "src/bin/atlas-duck.rs"

[[bin]]
name = "atlas-duck-sandbox"
path = "src/bin/atlas-duck-sandbox.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
atlas-duck-cli = { path = "../../crates/cli" }
atlas-duck-sandbox-worker = { path = "../../crates/sandbox-worker" }
atlas-duck-ipc = { path = "../../crates/ipc" }
atlas-duck-sandbox-host = { path = "../../crates/sandbox-host" }
atlas-duck-audit = { path = "../../crates/audit" }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-autostart = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
libc = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_ErrorReporting",
] }

[dev-dependencies]
# `test` is dev-only: release builds never compile the mock runtime (T20).
tauri = { workspace = true, features = ["test"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
filetime = { workspace = true }

# T19: the Windows probe test inspects the worker's modules and the session.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
] }
