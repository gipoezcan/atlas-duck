[package]
name = "atlas-duck-app"
description = "atlas-duck tray app (Tauri 2) and the thin mains of the atlas-duck and atlas-duck-sandbox bins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# §12.1: `default-run = "atlas-duck-app"`.
default-run = "atlas-duck-app"
# The three bins are listed explicitly below; no auto-discovery.
autobins = false

[lib]
name = "atlas_duck_app_lib"
path = "src/lib.rs"

# §12.1: all three binaries are [[bin]] targets of the Tauri package (thin mains calling into their
# crates), so the Tauri bundler ships them next to the app without target-triple renaming.
[[bin]]
name = "atlas-duck-app"
path = "src/main.rs"

[[bin]]
name = "atlas-duck"
path = "src/bin/atlas-duck.rs"

[[bin]]
name = "atlas-duck-sandbox"
path = "src/bin/atlas-duck-sandbox.rs"

[features]
# PD-01..PD-03: the headless test build (test home, file keystore, scripted decisions, control dir,
# plain http to the mock). `lib.rs` refuses to compile it into a release build, it is in no default
# feature, and `ci/check-workspace.mjs` allows only this feature (and the crates' own `testing`) to
# forward the test-only features below.
scripted-approver = [
    "atlas-duck-ipc/test-paths",
    "atlas-duck-cli/test-env",
    "atlas-duck-core/testing",
    # The V12 marker (`GetFileType`, `GetFinalPathNameByHandleW`) in `testing::control`.
    "windows-sys/Win32_Storage_FileSystem",
]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
atlas-duck-cli = { path = "../../crates/cli" }
atlas-duck-core = { path = "../../crates/core" }
atlas-duck-sandbox-worker = { path = "../../crates/sandbox-worker" }
atlas-duck-ipc = { path = "../../crates/ipc" }
atlas-duck-sandbox-host = { path = "../../crates/sandbox-host" }
atlas-duck-audit = { path = "../../crates/audit" }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-notification = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
libc = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_ErrorReporting",
    "Win32_System_Time",
] }

[dev-dependencies]
# `test` is dev-only: release builds never compile the mock runtime (T20).
tauri = { workspace = true, features = ["test"] }
atlas-duck-audit = { path = "../../crates/audit", features = ["testing"] }
# T21: the scripted approver's unit test runs over `core::testing::Harness` and its mock Jira.
atlas-duck-atlassian = { path = "../../crates/atlassian", features = ["testing"] }
# T22: the cli_flows harness (mock servers, spawned binaries, product ids).
atlas-duck-registry = { path = "../../crates/registry" }
# `io-util`: the T23 flows read a spawned CLI's stderr line by line and write its stdin. `net`: the
# T25 squatter pipe (Windows named pipes).
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time", "io-util", "net"] }
secrecy = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
filetime = { workspace = true }

# T19: the Windows probe test inspects the worker's modules and the session. T25: the S-02 flows
# read a process's parent (Toolhelp), resume a suspended CLI and put it in a job object.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
