[package]
name = "atlas-duck-app"
description = "atlas-duck tray app (Tauri 2) and the thin mains of the atlas-duck and atlas-duck-sandbox bins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# §12.1: `default-run = "atlas-duck-app"`.
default-run = "atlas-duck-app"
# The three bins are listed explicitly below; no auto-discovery.
autobins = false

[lib]
name = "atlas_duck_app_lib"
path = "src/lib.rs"

# §12.1: all three binaries are [[bin]] targets of the Tauri package (thin mains calling into their
# crates), so the Tauri bundler ships them next to the app without target-triple renaming.
[[bin]]
name = "atlas-duck-app"
path = "src/main.rs"

[[bin]]
name = "atlas-duck"
path = "src/bin/atlas-duck.rs"

[[bin]]
name = "atlas-duck-sandbox"
path = "src/bin/atlas-duck-sandbox.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
atlas-duck-cli = { path = "../../crates/cli" }
atlas-duck-sandbox-worker = { path = "../../crates/sandbox-worker" }
atlas-duck-ipc = { path = "../../crates/ipc" }

[dev-dependencies]
serde_json = { workspace = true }
