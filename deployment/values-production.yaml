# Production values (M13 plan T11; filled at deploy time 2026-10-27, decisions in the M13
# ledger). No secret belongs here (SM-9.1): the master key is the Secret atlas-duck-master-key,
# created out of band (docs/server/deployment.md).

mode: production

publicUrl: https://atlas-duck.dux.intern.gipmbh.de

ingress:
  # The cluster's controller is nginx.org (IngressClass nginx); chart defaults carry the
  # nginx.org SSE annotations.
  className: nginx
  host: atlas-duck.dux.intern.gipmbh.de
  tls:
    # Issued by cert-manager (ClusterIssuer letsencrypt), like team-dux's other hosts.
    secretName: atlas-duck-tls
    certManager:
      issuer: letsencrypt
      issuerKind: ClusterIssuer

persistence:
  # ADR 0004: local-path is not provisioned on this cluster's nodes and no block class exists,
  # so the data lives on the team's NFS class: ReadWriteOnce, one replica, Recreate, and SQLite
  # in rollback-journal mode with an exclusive lock (no WAL on NFS).
  storageClassName: team-dux-storage
  size: 10Gi
  keep: true
  sqliteJournal: delete
  backups:
    enabled: true
    storageClassName: team-dux-storage
    size: 20Gi
    keep: 14

masterKey:
  existingSecret: atlas-duck-master-key

directory:
  ldap:
    url: ldaps://sro-ad-4.intern.gipmbh.de:636
    upnSuffix: "@gipmbh.de"
    baseDn: DC=intern,DC=gipmbh,DC=de
  # Q6: no read-only service account yet; offboarding is manual (docs/server/offboarding.md).
  serviceBind:
    dn: ""
    existingSecret: ""

groups:
  # The DUX team group (AD, read 2026-10-27). Admins are the same team: admins have no access to
  # user data (SM-2.5). No auditors group yet: no auditor role.
  users: CN=G-DUX,OU=Teams,OU=Gruppen,DC=intern,DC=gipmbh,DC=de
  auditors: ""
  admins: CN=G-DUX,OU=Teams,OU=Gruppen,DC=intern,DC=gipmbh,DC=de

testDirectory:
  enabled: false

networkPolicy:
  enabled: true
  # The ingress controller's namespace is not visible to the team: the HTTP port is open to
  # every namespace, everything else is closed.
  ingressFromAllNamespaces: true
  # LDAPS only to sro-ad-4.intern.gipmbh.de (resolved 2026-10-27).
  directoryCidrs:
    - 172.31.0.15/32

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi