# Review environment values (M13 plan T11, PD-M13-8, SM-9.5): test directory, test master key,
# throwaway volume. deploy:review sets publicUrl, ingress.host, ingress.tls.secretName
# (atlas-duck-<slug>-tls), masterKey.existingSecret and the image per branch.

mode: review

ingress:
  className: nginx
  tls:
    certManager:
      issuer: letsencrypt
      issuerKind: ClusterIssuer

# ADR 0004: the NFS volume's root is root:root 0770, fsGroup is not applied and the NFS server
# ignores supplementary groups: the primary gid 0 lets the non-root server (uid 65532) create its
# directories there, as dux-deployment-bot runs. Its umask 077 keeps them private.
gid: 0
fsGroup: 0

persistence:
  # ADR 0004: the team's NFS class, ReadWriteOnce, SQLite in rollback-journal mode.
  storageClassName: team-dux-storage
  size: 1Gi
  keep: false
  sqliteJournal: delete

testDirectory:
  enabled: true

# The test users' groups (deployment/testdir/users.json).
groups:
  users: cn=atlas-duck-users,ou=groups,dc=test
  auditors: cn=atlas-duck-auditors,ou=groups,dc=test
  admins: cn=atlas-duck-admins,ou=groups,dc=test

networkPolicy:
  enabled: true
  ingressFromAllNamespaces: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Known cluster issue (2026-10-28): pods on node k3s-gip-pair1-2 are unreachable from other nodes
# (ingress 502, helm test "connection refused", while a port-forward to the pod works). Keep the
# server off that node until the cluster admins fix cross-node traffic to it (admin ticket:
# TICKET-TBD; docs/server/deployment.md "Known cluster issues"). Remove this block then.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - k3s-gip-pair1-2