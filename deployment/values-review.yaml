# Review environment values (M13 plan T11, PD-M13-8, SM-9.5): test directory, test master key,
# throwaway volume. The deploy:review job sets publicUrl, ingress.host, ingress.tls.secretName,
# masterKey.existingSecret and the image per branch; it refuses to run while any CHANGE-ME is
# left in this file.

mode: review

ingress:
  className: ""

persistence:
  # Q1: a storage class offering ReadWriteOnce block storage (not NFS, ADR 0003).
  storageClassName: CHANGE-ME
  size: 1Gi
  keep: false

testDirectory:
  enabled: true

# The test users' groups (deployment/testdir/users.json).
groups:
  users: cn=atlas-duck-users,ou=groups,dc=test
  auditors: cn=atlas-duck-auditors,ou=groups,dc=test
  admins: cn=atlas-duck-admins,ou=groups,dc=test

networkPolicy:
  enabled: true
  # Q2: labels of the ingress controller namespace (the smoke test reaches the pod through it).
  ingressNamespaceSelectors:
    - kubernetes.io/metadata.name: CHANGE-ME

# M14 PD-246: one run and one dry run at a time; memory 1Gi + (1 + 1) x 512Mi.
scripts:
  runsMax: 1
  dryRunsMax: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 2Gi